[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shutyl"
description = 'A file conversion and copying tool for making compressed copies of music libraries.'
readme = "README.md"
requires-python = ">=3.7"
license = "GPL-3.0-only"
keywords = []
authors = [
  { name = "Wyatt Childers", email = "wchilders@nearce.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: English",
  "Operating System :: OS Independent"
]
dependencies = ["termcolor"]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/DarkArc/shutyl#readme"
Issues = "https://github.com/DarkArc/shutyl/issues"
Source = "https://github.com/DarkArc/shutyl"

[project.scripts]
shutyl = "shutyl.main:main"

[tool.hatch.version]
path = "shutyl/__about__.py"

[tool.hatch.build.targets.sdist]
[tool.hatch.build.targets.wheel]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "shutyl/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
